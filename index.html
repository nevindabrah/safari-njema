<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A travel companion for Kenya. Add the places you are going and get a short Swahili lesson made for each one." />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Safari Njema" />
    <meta property="og:description" content="A travel companion for Kenya. Duolingo, but the curriculum is your itinerary." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffc83d" />
    <title>Safari Njema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
      rel="stylesheet"
    />
    <!-- Applies a saved light or dark choice before the app loads, so the page never flashes the wrong theme. -->
    <script>
      try { var t = localStorage.getItem('safari-njema-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
